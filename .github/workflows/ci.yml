name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 26

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    # A stuck download fails the run instead of holding it for an hour.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: '3.12'
      - name: Install
        id: install
        run: |
          for project in packages/react-native-splat packages/react-native-on-device apps/field-guide services/instructor-proxy services/voice-agent; do
            npm ci --prefix "$project"
          done
      # Each check runs after a failed one, so a single run reports every failure.
      - name: App
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: apps/field-guide
        run: npm run lint && npm run typecheck && npm test -- --runInBand
      - name: Native packages
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          for package in react-native-splat react-native-on-device; do
            (cd "packages/$package" && npm run lint && npm run typecheck && npm test)
          done
      - name: Services
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          (cd services/instructor-proxy && npm test && npx tsc --noEmit -p .)
          (cd services/voice-agent && npm test && npm run typecheck)
      - name: Pipeline
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          uv run --project pipeline python -m pytest pipeline/tests -q
          node --test pipeline/tests/test_mark_page.cjs
          uvx ruff check --select F,E9 pipeline scripts
      # The runner image already has CMake, Make and zlib, so nothing is downloaded from apt.
      # Android ships the portable SHA-256 and iOS uses CommonCrypto; no device uses the OpenSSL path.
      - name: Engine
        if: ${{ !cancelled() }}
        run: |
          cmake -S packages/react-native-splat/engine/splatkit-engine -B build/tests -DCMAKE_BUILD_TYPE=Debug -DSPLATKIT_ENGINE_BUILD_TESTS=ON -DSPLAT_CORE_PORTABLE_SHA256=ON
          cmake --build build/tests --parallel
          ctest --test-dir build/tests --output-on-failure
