apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react {
    autolinkLibrariesWithApp()
}

def enableProguardInReleaseBuilds = false

def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

def uploadStoreFile = project.findProperty('FIELD_GUIDE_UPLOAD_STORE_FILE')

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "dev.splatfieldguide.app"
    defaultConfig {
        applicationId "dev.splatfieldguide.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (uploadStoreFile) {
            release {
                storeFile file(uploadStoreFile)
                storePassword project.findProperty('FIELD_GUIDE_UPLOAD_STORE_PASSWORD')
                keyAlias project.findProperty('FIELD_GUIDE_UPLOAD_KEY_ALIAS')
                keyPassword project.findProperty('FIELD_GUIDE_UPLOAD_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Without an upload key, Release is debug-signed and only fit for local installs.
            signingConfig uploadStoreFile ? signingConfigs.release : signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

// Copy only runtime pack records, checking their identity before they enter the APK.
def runtimeAssets = layout.buildDirectory.dir('generated/fieldGuideAssets')
def prepareFieldGuideAssets = tasks.register('prepareFieldGuideAssets', Exec) {
    inputs.files(fileTree('../../../../data/pack') {
        include '**/manifest.json', '**/*.spz', '**/labels.bin'
        exclude '.sources/**', 'releases/**'
    })
    inputs.dir('../../assets/fonts')
    inputs.file('../../scripts/prepare-android-assets.cjs')
    inputs.file('../../ios/FieldGuide/ThirdPartyNotices.txt')
    inputs.file('../ThirdPartyNotices.txt')
    inputs.file('../../../../packages/react-native-splat/engine/LICENSE')
    inputs.file('../../../../packages/react-native-splat/engine/splat-core/vendor/picosha2/LICENSE')
    inputs.dir('../../../../packages/react-native-splat/engine/splatkit-android/licenses')
    outputs.dir(runtimeAssets)
    commandLine 'node', file('../../scripts/prepare-android-assets.cjs'), runtimeAssets.get().asFile
}
android.sourceSets.main.assets.srcDir(runtimeAssets.get().asFile)
tasks.named('preBuild').configure { dependsOn prepareFieldGuideAssets }
