# A 512 MB metaspace runs out during Release builds and discards the daemon.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=1g
org.gradle.workers.max=3

android.useAndroidX=true
reactNativeArchitectures=arm64-v8a
newArchEnabled=true
hermesEnabled=true
edgeToEdgeEnabled=true

# Opt out of built-in Kotlin and the new DSL that ship with AGP 9; AGP 10 removes these opt-outs.
android.builtInKotlin=false
android.newDsl=false
# Keep Kotlin module visibility stable for linked local packages.
kotlin.incremental=false
